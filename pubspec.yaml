  camera: ^0.11.4
  image: ^3.3.0
  permission_handler: ^12.0.0

  # Machine Learning
  tflite_flutter: ^0.11.0
  # hand_detection: ^3.0.2  # Désactivé - utilise tflite_ai_service à la place (pas besoin d'OpenCV)

